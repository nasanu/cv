<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nathan Brown - Portfolio</title>
    <meta
      name="description"
      content="The portfolio of Nathan Brown, a software engineer with 30 years of experience. Take a white Countach down a neon retrowave highway, past billboards of his work, in a site built from nothing but HTML, CSS and JavaScript."
    />
    <link rel="canonical" href="https://kidshibuya.io/" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- what a link to the site shows when it is shared (Open Graph for most apps, the Twitter card for X); the picture is
         the scene itself at the 1200 x 630 sharing size, and its address must be absolute -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nathan Brown" />
    <meta property="og:url" content="https://kidshibuya.io/" />
    <meta property="og:title" content="Nathan Brown - Portfolio" />
    <meta
      property="og:description"
      content="Insert coin: drive a white Countach down a neon retrowave highway, past billboards of 30 years of software engineering."
    />
    <meta property="og:image" content="https://kidshibuya.io/images/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A white Lamborghini Countach on a neon highway at night, beside a wireframe city, as three fighter jets pull up past a striped retrowave sun"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nathan Brown - Portfolio" />
    <meta
      name="twitter:description"
      content="Insert coin: drive a white Countach down a neon retrowave highway, past billboards of 30 years of software engineering."
    />
    <meta name="twitter:image" content="https://kidshibuya.io/images/og.jpg" />
    <meta
      name="twitter:image:alt"
      content="A white Lamborghini Countach on a neon highway at night, beside a wireframe city, as three fighter jets pull up past a striped retrowave sun"
    />
    <!-- added to the home screen, it opens full screen in landscape, with no browser bar (the only way on an iPhone) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      fn-lambo {
        outline: none;
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <fn-lambo fill src="./images/lambo-transparent.png" avatar="./images/me.jpg" speed="0.2"></fn-lambo>
    <script src="./content/tables.js"></script>
    <script src="./lib/lambo.js"></script>
    <script>
      // On a phone in landscape, the first tap takes the page full screen, with no browser bar (a browser only allows
      // that from a tap). Turning back to portrait leaves full screen. iPhones have no full screen for pages: there the
      // page only fills the screen when it is added to the home screen (see the manifest).
      const landscape = matchMedia("(orientation: landscape) and (pointer: coarse)");
      const root = document.documentElement;
      if (root.requestFullscreen) {
        addEventListener("pointerup", (e) => {
          if (e.pointerType === "mouse" || !landscape.matches || document.fullscreenElement) return;
          root.requestFullscreen({ navigationUI: "hide" }).catch(() => {}); // (refused: it stays as it is)
        });
        landscape.addEventListener("change", () => {
          if (!landscape.matches && document.fullscreenElement) document.exitFullscreen().catch(() => {});
        });
      }
    </script>
  </body>
</html>
