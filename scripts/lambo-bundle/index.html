<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rex-lambo demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      /* the whole window: the fill attribute makes the component run full screen, not in a box */
      rex-lambo {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <!-- src and avatar are optional, these are the defaults -->
    <rex-lambo fill src="./lambo-transparent.png" avatar="./me.jpg" speed="0.2"></rex-lambo>

    <!-- lambo.js is a plain script (no imports), so this page also works opened straight from disk -->
    <script src="./lambo.js"></script>
  </body>
</html>
